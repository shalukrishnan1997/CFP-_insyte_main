---
# Codacy Configuration for Django Project
# This file configures code quality analysis for the responsehandling Django project

# Exclude paths from analysis
exclude_paths:
  # Python virtual environments
  - "venv/**"
  - ".venv/**"
  - "env/**"
  - ".env/**"
  
  # Django migrations (auto-generated)
  - "**/migrations/**"
  
  # Python cache files
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.pyo"
  
  # Static and media files
  - "static/**"
  - "staticfiles/**"
  - "media/**"
  
  # Build and distribution
  - "build/**"
  - "dist/**"
  - "*.egg-info/**"
  
  # Database files
  - "*.sqlite3"
  - "*.db"
  
  # Documentation and notes
  - "notes.txt"
  - "docs/**"
  
  # Git files
  - ".git/**"

# Configure specific engines (tools)
engines:
  # Bandit - Python security linter
  bandit:
    enabled: true
    exclude_paths:
      - "**/tests.py"
      - "**/test_*.py"
    python_version: 3
  
  # Ruff - Fast Python linter (matches your pyproject.toml config)
  # Handles linting, formatting, and import sorting
  ruff:
    enabled: true
  
  # Prospector - Comprehensive Python static analysis
  # Includes pylint, pyflakes, mccabe, and more in one tool
  prospector:
    enabled: true
  
  # Security scanners
  trivy:
    enabled: true
  
  # Secrets detection
  secrets:
    enabled: true
  
  # Code duplication detection
  duplication:
    enabled: true
    config:
      languages:
        - python:
            mass_threshold: 60  # Minimum duplicate mass
            min_tokens: 100      # Minimum tokens for duplication

# File extensions to analyze
file_extensions:
  - ".py"
  - ".html"
  - ".css"
  - ".js"

# Coverage settings (if using coverage reports)
coverage:
  enabled: false

# Metrics configuration
metrics:
  enabled: true

# Django-specific patterns to handle
patterns:
  - pattern: "django.contrib.admin"
    enabled: true
  - pattern: "django.contrib.auth"
    enabled: true
  - pattern: "django.core"
    enabled: true

# Specific tool configurations
tools:
  prospector:
    patterns:
      # Django-specific checks
      - id: "django-not-configured"
        enabled: false  # Django is configured in settings.py
      
      # Disable some common false positives
      - id: "missing-docstring"
        enabled: false
      - id: "too-few-public-methods"
        enabled: false
      - id: "too-many-arguments"
        enabled: false
  
  bandit:
    patterns:
      # Allow debug mode for development (controlled by environment)
      - id: "B201"
        enabled: false
      
      # Detect hardcoded passwords
      - id: "B105"
        enabled: true
      - id: "B106"
        enabled: true
  
  ruff:
    patterns:
      # Ignore line length (as per pyproject.toml)
      - id: "E501"
        enabled: false

  semgrep:
    patterns:
      # False positive: logout form at templates/layouts/admin_layout.html already
      # includes {% csrf_token %} — Semgrep fails to detect it in Django template syntax.
      - id: "codacy.tools-configs.python.django.security.django-no-csrf-token.django-no-csrf-token"
        enabled: false

# Quality settings
quality:
  duplication:
    threshold: 5  # Percentage of duplicated code allowed
  
  coverage:
    threshold: 0  # Minimum coverage percentage (adjust as needed)

# Issue thresholds
thresholds:
  critical: 0
  high: 0
  medium: 10
  low: 20
