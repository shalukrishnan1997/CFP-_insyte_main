<div x-data="donationNav('{{ prev_url|default:''|escapejs }}', '{{ next_url|default:''|escapejs }}', '{{ last_url|default:''|escapejs }}')" x-init="bindKeys()" class="flat-card flex flex-col gap-3 px-4 py-3 md:flex-row md:items-center md:justify-between">
  <div>
    <p class="text-xs text-gray-500">Batch: {{ batch.batch_name }}</p>
    <p class="text-[13px] font-semibold text-gray-900">Donation {{ position }} of {{ total_donations }}</p>
  </div>
  <div class="flex items-center gap-2 self-start md:self-auto">
    <a :href="prevUrl || '#'" :class="prevUrl ? 'bg-white hover:bg-gray-50 text-gray-700 border-gray-300' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'" class="dense-button border rounded-md text-sm font-medium transition">Previous</a>
    <a :href="nextUrl || '#'" :class="nextUrl ? 'bg-blue-600 hover:bg-blue-700 text-white border-blue-600' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'" class="dense-button border rounded-md text-sm font-medium transition-colors">Next</a>
    <a :href="lastUrl || '#'" :class="lastUrl ? 'bg-slate-700 hover:bg-slate-800 text-white border-slate-700' : 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed'" class="dense-button border rounded-md text-sm font-medium transition">Last</a>
  </div>
</div>
<script>
  (() => {
    if (!window.__qaDonationNavKeyHandlerBound) {
      window.addEventListener('keydown', (event) => {
        const navState = window.__qaDonationNavState || {};
        const target = event.target;
        const isTypingTarget = target && target.tagName && (
          target.tagName === 'INPUT'
          || target.tagName === 'TEXTAREA'
          || target.tagName === 'SELECT'
          || target.isContentEditable
        );

        if (isTypingTarget) {
          return;
        }
        if (event.key === 'ArrowLeft' && navState.prevUrl) {
          event.preventDefault();
          window.location.href = navState.prevUrl;
        }
        if (event.key === 'ArrowRight' && navState.nextUrl) {
          event.preventDefault();
          window.location.href = navState.nextUrl;
        }
        if (event.key === 'End' && navState.lastUrl) {
          event.preventDefault();
          window.location.href = navState.lastUrl;
        }
      });
      window.__qaDonationNavKeyHandlerBound = true;
    }

    window.donationNav = function donationNav(prevUrl, nextUrl, lastUrl) {
      return {
        prevUrl: prevUrl || '',
        nextUrl: nextUrl || '',
        lastUrl: lastUrl || '',
        bindKeys() {
          window.__qaDonationNavState = {
            prevUrl: this.prevUrl,
            nextUrl: this.nextUrl,
            lastUrl: this.lastUrl,
          };
        },
      };
    };
  })();
</script>
