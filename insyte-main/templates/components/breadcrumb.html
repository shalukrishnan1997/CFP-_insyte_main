<!-- Breadcrumb Navigation Component -->
{% if breadcrumbs %}
<nav class="workspace-breadcrumb flex" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-1.5 md:space-x-2">
    <li class="inline-flex items-center">
      <a href="{% url url_namespace|add:':admin_dashboard' %}" class="inline-flex items-center font-medium text-slate-500 hover:text-blue-600">
        <svg class="mr-1.5 h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
        </svg>
        Home
      </a>
    </li>
    {% for crumb in breadcrumbs %}
    <li>
      <div class="flex items-center">
        <svg class="h-4 w-4 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
        </svg>
        {% if crumb.url %}
          <a href="{{ crumb.url }}" class="ml-1 font-medium text-slate-500 hover:text-blue-600 md:ml-1.5">{{ crumb.name }}</a>
        {% else %}
          <span class="ml-1 font-medium text-slate-700 md:ml-1.5" aria-current="page">{{ crumb.name }}</span>
        {% endif %}
      </div>
    </li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
