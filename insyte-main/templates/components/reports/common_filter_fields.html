<div>
  <label class="block text-sm font-medium text-gray-700 mb-1.5">From Date</label>
  {% if use_uk_date_fields %}
  <input type="text" name="date_from"
         value="{{ date_from|date:'d/m/Y' }}"
         placeholder="DD/MM/YYYY"
         autocomplete="off"
         class="uk-date-field-panel block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
  {% else %}
  <input type="date" name="date_from"
         value="{{ date_from }}"
         class="block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
  {% endif %}
</div>

<div>
  <label class="block text-sm font-medium text-gray-700 mb-1.5">To Date</label>
  {% if use_uk_date_fields %}
  <input type="text" name="date_to"
         value="{{ date_to|date:'d/m/Y' }}"
         placeholder="DD/MM/YYYY"
         autocomplete="off"
         class="uk-date-field-panel block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
  {% else %}
  <input type="date" name="date_to"
         value="{{ date_to }}"
         class="block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
  {% endif %}
</div>

<div>
  <label class="block text-sm font-medium text-gray-700 mb-1.5">Rows per page</label>
  <select name="per_page"
          class="block w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    <option value="25" {% if per_page == 25 %}selected{% endif %}>25</option>
    <option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
    <option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
  </select>
</div>
