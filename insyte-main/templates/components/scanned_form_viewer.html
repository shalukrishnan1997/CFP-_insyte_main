<div class="flat-card overflow-hidden flex flex-col h-full"
  x-data="scannedFormViewer('{{ image_url|default:''|escapejs }}', '{{ predicted_url|default:''|escapejs }}', {{ has_image|default:'false'|lower }}, '{{ page_urls_json|default:'[]'|escapejs }}', {% if show_loading %}true{% else %}false{% endif %}, {{ redaction_enabled|default:'false'|lower }}, {{ redaction_pending|default:'false'|lower }}, '{{ redaction_status|default:''|escapejs }}', '{{ redaction_notes|default:''|escapejs }}', '{{ redaction_save_url|default:''|escapejs }}')"
  x-init="init()"
  @viewer-update.window="updateViewer($event.detail)"
  @viewer-loading.window="setLoading($event.detail.loading)"
  id="{{ viewer_id|default:'scanned-form-viewer' }}">

  <div class="flex items-center justify-between gap-3 px-4 py-2.5 border-b border-slate-200 bg-slate-50 shrink-0">
    <div class="min-w-0">
      <p class="text-[13px] font-semibold text-gray-900 flex items-center gap-2">
        <svg class="w-4 h-4 text-blue-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Scanned Form</span>
        <span x-show="hasImage && !isLoading"
              class="inline-block w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-100"></span>
        <span x-show="!hasImage && !isLoading"
              class="inline-block w-2 h-2 rounded-full bg-gray-300 ring-2 ring-gray-100"></span>
        <template x-if="redactionEnabled">
          <span class="inline-flex items-center rounded-full border px-2 py-0.5 text-[11px] font-semibold"
                :class="redactionPending ? 'border-amber-200 bg-amber-50 text-amber-800' : 'border-emerald-200 bg-emerald-50 text-emerald-700'"
                x-text="redactionPending ? 'QA redaction pending' : 'QA redaction saved'"></span>
        </template>
      </p>
      {% if subtitle %}
      <p class="text-xs text-gray-500 truncate">{{ subtitle }}</p>
      {% endif %}
    </div>

    <div class="flex items-center gap-1.5" x-show="hasImage && !isLoading" x-transition>
      <div class="flex items-center gap-1" x-show="pageUrls.length > 1">
        <button type="button" @click="previousPage" :disabled="currentPageIndex === 0" title="Previous page"
          class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <span class="text-xs font-mono text-gray-500 min-w-[52px] text-center select-none tabular-nums"
              x-text="`${currentPageIndex + 1}/${pageUrls.length}`"></span>
        <button type="button" @click="nextPage" :disabled="currentPageIndex >= pageUrls.length - 1" title="Next page"
          class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <div class="w-px h-5 bg-gray-200 mx-0.5"></div>
      </div>
      <button type="button" @click="zoomOut" title="Zoom out"
        class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" />
        </svg>
      </button>
      <span class="text-xs font-mono text-gray-500 min-w-[42px] text-center select-none tabular-nums"
            x-text="`${Math.round(scale * 100)}%`"></span>
      <button type="button" @click="zoomIn" title="Zoom in"
        class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
        </svg>
      </button>
      <div class="w-px h-5 bg-gray-200 mx-0.5"></div>
      <button type="button" @click="reset" title="Reset view"
        class="p-1.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </div>

  <template x-if="redactionEnabled">
    <div class="border-b border-slate-200 bg-white px-4 py-3 space-y-3">
      <div class="flex flex-wrap items-center gap-2">
        <button type="button"
          @click="toggleRedactionMode"
          x-show="hasImage"
          class="dense-button rounded-md bg-slate-900 px-3 py-2 text-xs font-medium text-white hover:bg-slate-800">
          <span x-text="editMode ? 'Pause redaction' : (redactionPending ? 'Start redaction' : 'Edit saved redaction')"></span>
        </button>
        <button type="button"
          @click="undoLastRedaction"
          x-show="editMode"
          :disabled="currentPageRedactionCount() === 0"
          class="dense-button rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40">
          Undo last box
        </button>
        <button type="button"
          @click="clearCurrentPageRedactions"
          x-show="editMode"
          :disabled="currentPageRedactionCount() === 0"
          class="dense-button rounded-md border border-slate-300 bg-white px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40">
          Clear page
        </button>
        <button type="button"
          @click="cvvDrawMode = !cvvDrawMode"
          x-show="editMode"
          :class="cvvDrawMode
            ? 'dense-button rounded-md bg-red-600 px-3 py-2 text-xs font-medium text-white hover:bg-red-700'
            : 'dense-button rounded-md border border-red-300 bg-white px-3 py-2 text-xs font-medium text-red-700 hover:bg-red-50'">
          <span x-text="cvvDrawMode ? 'Drawing CVV box (red)' : 'Mark CVV box'"></span>
        </button>
        <button type="button"
          @click="saveRedactions"
          x-show="hasImage"
          :disabled="isSavingRedaction || totalRedactionCount() === 0 || !redactionSaveUrl"
          class="dense-button rounded-md bg-emerald-600 px-3 py-2 text-xs font-medium text-white hover:bg-emerald-700 disabled:opacity-40">
          <span x-text="isSavingRedaction ? 'Saving redacted copy…' : 'Save redacted copy'"></span>
        </button>
        <span class="text-xs text-slate-500" x-show="hasImage"
          x-text="`${totalRedactionCount()} box${totalRedactionCount() === 1 ? '' : 'es'} (${cvvRedactionCount()} CVV) across ${pageUrls.length || 1} page(s)`"></span>
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-medium text-slate-600">Redaction notes</label>
        <textarea x-model="redactionNotes" rows="2"
          class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Optional note about what was redacted"></textarea>
      </div>
      <p x-show="redactionMessage"
         x-text="redactionMessage"
         class="text-xs text-emerald-700"></p>
      <p x-show="redactionError"
         x-text="redactionError"
         class="text-xs text-red-600"></p>
      <p class="text-xs text-slate-500" x-show="editMode">
        Drag to place black boxes for PAN, expiry, signature etc. Use <span class="font-medium text-red-700">Mark CVV box</span> to switch to red mode for the CVV rectangle — it gets blacked out the moment the card is authorized (PCI DSS 3.2). Zoom and pan stay available while you work.
      </p>
    </div>
  </template>

  <div class="bg-slate-50 flex-1 flex items-center justify-center relative overflow-hidden{% if compact %} min-h-[300px]{% else %} min-h-[400px]{% endif %}"
       :class="{ 'cursor-grab': scale > 1.05 && !isPanning && !editMode, 'cursor-grabbing': isPanning, 'cursor-default': scale <= 1.05 || editMode }"
       @mousedown="startPan($event)"
       @mousemove="doPan($event)"
       @mouseup="endPan()"
       @mouseleave="endPan()"
       @wheel.prevent="handleWheel($event)">

    <template x-if="isLoading">
      <div class="flex flex-col items-center gap-3 animate-pulse">
        <div class="w-12 h-12 rounded-full border-4 border-blue-200 border-t-blue-500 animate-spin"></div>
        <p class="text-sm text-gray-500 font-medium">Loading scanned form…</p>
      </div>
    </template>

    <template x-if="hasImage && !isLoading && !redactionEnabled && !isPdf">
      <img :src="imageUrl"
           :style="`transform: translate(${panX}px, ${panY}px) scale(${scale}); transform-origin: center; user-select: none; will-change: transform;`"
           class="max-h-full max-w-full object-contain transition-transform duration-100 ease-out pointer-events-none"
           alt="Scanned donation form" draggable="false"
           @load="imageLoaded = true" @error="hasImage = false">
    </template>

    <template x-if="hasImage && !isLoading && !redactionEnabled && isPdf">
      <iframe :src="imageUrl" class="w-full h-full border-0" title="Scanned form PDF"></iframe>
    </template>

    <template x-if="hasImage && !isLoading && redactionEnabled">
      <div class="flex h-full w-full items-center justify-center overflow-auto p-4">
        <div class="relative shrink-0"
             :style="`transform: translate(${panX}px, ${panY}px) scale(${scale}); transform-origin: center; width:${documentWidth}px; height:${documentHeight}px;`">
          <canvas x-ref="baseCanvas" class="block rounded shadow-sm bg-white"></canvas>
          <canvas x-ref="overlayCanvas"
            class="absolute inset-0"
            :class="editMode ? 'cursor-crosshair' : 'pointer-events-none'"
            @pointerdown="startRect($event)"
            @pointermove="moveRect($event)"
            @pointerup="finishRect($event)"
            @pointerleave="finishRect($event)"></canvas>
        </div>
      </div>
    </template>

    <template x-if="!hasImage && !isLoading">
      <div class="text-center space-y-4 p-8 max-w-sm">
        <div class="mx-auto w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center">
          <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-700">No scanned form found</p>
          <p class="text-xs text-gray-500 mt-1 break-all" x-show="predictedUrl"
             x-text="'Expected: ' + predictedUrl"></p>
        </div>
        <div class="inline-flex items-center gap-2 px-3 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-xs">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Enter a URN to load the corresponding scanned form.</span>
        </div>
      </div>
    </template>

    <div x-show="scale > 1.1 && hasImage && !isLoading" x-transition.opacity.duration.200ms
         class="absolute top-3 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-gray-900/70 backdrop-blur-sm text-white text-xs rounded-full pointer-events-none shadow-lg">
      <span x-text="editMode ? 'Draw black boxes • Drag background to pan only when redaction is paused' : 'Drag to pan • Scroll to zoom'"></span>
    </div>
  </div>
</div>

<script>
  if (typeof window.scannedFormViewer === "undefined") {
    window.scannedFormViewer = function (
      imageUrl,
      predictedUrl,
      hasImage,
      pageUrlsJson,
      startLoading,
      redactionEnabled,
      redactionPending,
      redactionStatus,
      redactionNotes,
      redactionSaveUrl
    ) {
      let initialPages = [];
      if (pageUrlsJson) {
        try {
          initialPages = JSON.parse(pageUrlsJson);
        } catch (error) {
          initialPages = [];
        }
      }

      return {
        imageUrl: imageUrl || (initialPages[0] || ""),
        predictedUrl: predictedUrl || "",
        hasImage: !!hasImage || initialPages.length > 0,
        pageUrls: Array.isArray(initialPages) ? initialPages.filter(Boolean) : [],
        currentPageIndex: 0,
        isLoading: !!startLoading,
        imageLoaded: false,
        scale: 1,
        panX: 0,
        panY: 0,
        isPanning: false,
        startX: 0,
        startY: 0,
        redactionEnabled: !!redactionEnabled,
        redactionPending: !!redactionPending,
        redactionStatus:
          redactionStatus || (redactionPending ? "pending" : "completed"),
        redactionNotes: redactionNotes || "",
        redactionSaveUrl: redactionSaveUrl || "",
        editMode: !!redactionPending,
        isSavingRedaction: false,
        redactionMessage: "",
        redactionError: "",
        documentWidth: 0,
        documentHeight: 0,
        redactionsByPage: {},
        currentDraftRect: null,
        isDrawingRect: false,
        drawStart: null,
        renderNonce: 0,
        userHasZoomed: false,
        // When true, the next rectangle drawn is tagged is_cvv so it
        // gets applied to R2 immediately on the Stripe auth attempt
        // rather than after the charge succeeds. Required for PCI 3.2.
        cvvDrawMode: false,

        async init() {
          if (this.redactionEnabled && this.hasImage && !this.isLoading) {
            await this.renderActivePage();
          }
          this.emitRedactionState();
        },

        get isPdf() {
          const targetUrl = this.activePageUrl();
          if (!targetUrl) return false;
          const path = targetUrl.split("?")[0].toLowerCase();
          return path.endsWith(".pdf") || path.includes("/placeholder-pdf/");
        },

        activePageUrl() {
          return this.pageUrls[this.currentPageIndex] || this.imageUrl || "";
        },

        pageKey(index = this.currentPageIndex) {
          return this.pageUrls[index] || this.imageUrl || "__single__";
        },

        pageRedactions(index = this.currentPageIndex) {
          return this.redactionsByPage[this.pageKey(index)] || [];
        },

        currentPageRedactionCount() {
          return this.pageRedactions().length;
        },

        totalRedactionCount() {
          return Object.values(this.redactionsByPage).reduce((sum, rects) => {
            return sum + (Array.isArray(rects) ? rects.length : 0);
          }, 0);
        },

        cvvRedactionCount() {
          return Object.values(this.redactionsByPage).reduce((sum, rects) => {
            if (!Array.isArray(rects)) return sum;
            return sum + rects.filter((r) => r && r.is_cvv).length;
          }, 0);
        },

        emitRedactionState() {
          window.dispatchEvent(
            new CustomEvent("qa-redaction-state", {
              detail: {
                pending: this.redactionPending,
                status: this.redactionStatus,
              },
            })
          );
        },

        async ensurePdfJs() {
          if (window.__insytePdfJsPromise) {
            return window.__insytePdfJsPromise;
          }
          window.__insytePdfJsPromise = import(
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs"
          ).then((module) => {
            const pdfjs = module.default || module;
            if (pdfjs.GlobalWorkerOptions) {
              pdfjs.GlobalWorkerOptions.workerSrc =
                "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
            }
            return pdfjs;
          });
          return window.__insytePdfJsPromise;
        },

        async waitForCanvasRefs() {
          for (let i = 0; i < 10; i += 1) {
            await new Promise((resolve) => requestAnimationFrame(resolve));
            if (this.$refs.baseCanvas && this.$refs.overlayCanvas) {
              return true;
            }
          }
          return !!(this.$refs.baseCanvas && this.$refs.overlayCanvas);
        },

        async renderActivePage() {
          if (!this.redactionEnabled || !this.hasImage || this.isLoading) {
            return;
          }
          const refsReady = await this.waitForCanvasRefs();
          if (!refsReady) {
            return;
          }
          const baseCanvas = this.$refs.baseCanvas;
          const overlayCanvas = this.$refs.overlayCanvas;
          if (!baseCanvas || !overlayCanvas) {
            return;
          }

          const pageUrl = this.activePageUrl();
          if (!pageUrl) {
            return;
          }
          const renderNonce = ++this.renderNonce;
          this.redactionError = "";

          try {
            if (this.isPdf) {
              await this.renderPdfPage(pageUrl, baseCanvas, renderNonce);
            } else {
              await this.renderImagePage(pageUrl, baseCanvas, renderNonce);
            }
            if (renderNonce !== this.renderNonce) {
              return;
            }
            overlayCanvas.width = baseCanvas.width;
            overlayCanvas.height = baseCanvas.height;
            overlayCanvas.style.width = `${baseCanvas.width}px`;
            overlayCanvas.style.height = `${baseCanvas.height}px`;
            this.documentWidth = baseCanvas.width;
            this.documentHeight = baseCanvas.height;
            if (!this.userHasZoomed) {
              this.fitToViewport(baseCanvas);
            }
            this.drawOverlay();
          } catch (error) {
            console.error("Failed to render redaction page", error);
            this.redactionError = "This page could not be rendered for QA redaction.";
          }
        },

        async renderImagePage(pageUrl, canvas, renderNonce) {
          const tryLoad = (cacheBustToken) =>
            new Promise((resolve, reject) => {
              const image = new Image();
              image.decoding = "async";
              image.onload = () => resolve(image);
              image.onerror = reject;
              const sep = pageUrl.includes("?") ? "&" : "?";
              image.src = cacheBustToken
                ? `${pageUrl}${sep}_=${cacheBustToken}`
                : pageUrl;
            });

          const validDims = (img) =>
            (img.naturalWidth || img.width) > 0 &&
            (img.naturalHeight || img.height) > 0;

          let image;
          try {
            image = await tryLoad(null);
            if (!validDims(image)) {
              throw new Error("zero-dimension image response");
            }
          } catch {
            // Redacted images are uploaded to R2 immediately before this
            // request returns; eventual-consistency or proxy-cache misses
            // can briefly 404 or serve a zero-byte body. Retry once with a
            // cache-buster.
            await new Promise((r) => setTimeout(r, 600));
            image = await tryLoad(Date.now());
            if (!validDims(image)) {
              throw new Error("Image still has zero dimensions after retry");
            }
          }
          if (renderNonce !== this.renderNonce) {
            return;
          }
          canvas.width = image.naturalWidth || image.width;
          canvas.height = image.naturalHeight || image.height;
          canvas.style.width = `${canvas.width}px`;
          canvas.style.height = `${canvas.height}px`;
          const context = canvas.getContext("2d");
          if (!context) {
            throw new Error("2D canvas context not available");
          }
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
        },

        async renderPdfPage(pageUrl, canvas, renderNonce) {
          const pdfjs = await this.ensurePdfJs();
          const loadingTask = pdfjs.getDocument(pageUrl);
          const pdf = await loadingTask.promise;
          const page = await pdf.getPage(1);
          if (renderNonce !== this.renderNonce) {
            return;
          }
          const viewport = page.getViewport({ scale: 1.5 });
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          canvas.style.width = `${canvas.width}px`;
          canvas.style.height = `${canvas.height}px`;
          const context = canvas.getContext("2d");
          if (!context) {
            throw new Error("2D canvas context not available");
          }
          context.clearRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: context, viewport }).promise;
        },

        drawOverlay() {
          if (!this.redactionEnabled) {
            return;
          }
          const canvas = this.$refs.overlayCanvas;
          if (!canvas) {
            return;
          }
          const context = canvas.getContext("2d");
          if (!context) {
            return;
          }
          context.clearRect(0, 0, canvas.width, canvas.height);
          for (const rect of this.pageRedactions()) {
            // CVV rectangles render in red so the operator can see at a
            // glance which box has the immediate-redaction semantics.
            context.fillStyle = rect.is_cvv ? "#dc2626" : "#000000";
            context.fillRect(
              rect.x * canvas.width,
              rect.y * canvas.height,
              rect.width * canvas.width,
              rect.height * canvas.height
            );
          }
          if (this.currentDraftRect) {
            context.save();
            context.strokeStyle = this.cvvDrawMode ? "#dc2626" : "#111827";
            context.lineWidth = 2;
            context.setLineDash([6, 4]);
            context.strokeRect(
              this.currentDraftRect.x * canvas.width,
              this.currentDraftRect.y * canvas.height,
              this.currentDraftRect.width * canvas.width,
              this.currentDraftRect.height * canvas.height
            );
            context.restore();
          }
        },

        normalizedRect(startX, startY, endX, endY, width, height) {
          const left = Math.min(startX, endX) / width;
          const top = Math.min(startY, endY) / height;
          const right = Math.max(startX, endX) / width;
          const bottom = Math.max(startY, endY) / height;
          return {
            x: Math.max(0, left),
            y: Math.max(0, top),
            width: Math.max(0, Math.min(1, right) - Math.max(0, left)),
            height: Math.max(0, Math.min(1, bottom) - Math.max(0, top)),
          };
        },

        overlayPoint(event) {
          const canvas = this.$refs.overlayCanvas;
          if (!canvas) {
            return null;
          }
          const rect = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            return null;
          }
          return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top,
            width: rect.width,
            height: rect.height,
          };
        },

        toggleRedactionMode() {
          this.editMode = !this.editMode;
          this.redactionMessage = "";
          this.redactionError = "";
        },

        startRect(event) {
          if (!this.editMode) {
            return;
          }
          const point = this.overlayPoint(event);
          if (!point) {
            return;
          }
          event.preventDefault();
          this.isDrawingRect = true;
          this.currentDraftRect = this.normalizedRect(
            point.x,
            point.y,
            point.x,
            point.y,
            point.width,
            point.height
          );
          this.drawStart = point;
          this.drawOverlay();
        },

        moveRect(event) {
          if (!this.isDrawingRect || !this.drawStart) {
            return;
          }
          const point = this.overlayPoint(event);
          if (!point) {
            return;
          }
          this.currentDraftRect = this.normalizedRect(
            this.drawStart.x,
            this.drawStart.y,
            point.x,
            point.y,
            point.width,
            point.height
          );
          this.drawOverlay();
        },

        finishRect(event) {
          if (!this.isDrawingRect || !this.drawStart) {
            return;
          }
          const point = this.overlayPoint(event) || this.drawStart;
          const rect = this.normalizedRect(
            this.drawStart.x,
            this.drawStart.y,
            point.x,
            point.y,
            point.width,
            point.height
          );
          this.isDrawingRect = false;
          this.drawStart = null;
          this.currentDraftRect = null;
          if (rect.width > 0.005 && rect.height > 0.005) {
            const key = this.pageKey();
            const taggedRect = { ...rect, is_cvv: !!this.cvvDrawMode };
            this.redactionsByPage[key] = [...this.pageRedactions(), taggedRect];
            this.redactionPending = true;
            this.redactionStatus = "pending";
            // Auto-revert to standard mode after a CVV box is drawn
            // so the operator can't accidentally tag PAN/expiry as CVV.
            if (this.cvvDrawMode) {
              this.cvvDrawMode = false;
            }
          }
          this.drawOverlay();
          this.emitRedactionState();
        },

        undoLastRedaction() {
          const key = this.pageKey();
          const rects = [...this.pageRedactions()];
          rects.pop();
          this.redactionsByPage[key] = rects;
          this.drawOverlay();
          this.emitRedactionState();
        },

        clearCurrentPageRedactions() {
          this.redactionsByPage[this.pageKey()] = [];
          this.drawOverlay();
          this.emitRedactionState();
        },

        async saveRedactions() {
          if (!this.redactionSaveUrl || this.totalRedactionCount() === 0) {
            return;
          }
          this.isSavingRedaction = true;
          this.redactionError = "";
          this.redactionMessage = "";
          try {
            const totalPages = this.pageUrls.length || 1;
            const pages = [];
            const cvvPages = [];
            for (let index = 0; index < totalPages; index += 1) {
              const allRects = this.redactionsByPage[this.pageKey(index)] || [];
              const stripCoords = (rect) => ({
                x: rect.x,
                y: rect.y,
                width: rect.width,
                height: rect.height,
              });
              pages.push({
                page_index: index,
                rects: allRects.filter((r) => !r.is_cvv).map(stripCoords),
              });
              cvvPages.push({
                page_index: index,
                rects: allRects.filter((r) => r.is_cvv).map(stripCoords),
              });
            }
            const csrfToken =
              document.querySelector(
                '#qa-review-form input[name="csrfmiddlewaretoken"]'
              )?.value ||
              document.querySelector('input[name="csrfmiddlewaretoken"]')?.value ||
              "";
            const response = await fetch(this.redactionSaveUrl, {
              method: "POST",
              body: JSON.stringify({
                redaction_notes: this.redactionNotes || "",
                pages,
                cvv_pages: cvvPages,
              }),
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
                "X-Requested-With": "XMLHttpRequest",
              },
              credentials: "same-origin",
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              throw new Error(payload.error || "Redaction save failed");
            }
            this.redactionsByPage = {};
            this.currentDraftRect = null;
            this.redactionPending = false;
            this.redactionStatus = payload.redaction_status || "completed";
            this.redactionNotes = payload.redaction_notes || this.redactionNotes;
            this.editMode = false;
            this.redactionMessage = "Redacted scan saved successfully.";
            this.updateViewer({
              url: payload.image_url || "",
              pageUrls: payload.page_urls || [],
              found: Array.isArray(payload.page_urls)
                ? payload.page_urls.length > 0
                : !!payload.image_url,
              redactionStatus: payload.redaction_status || "completed",
            });
            this.emitRedactionState();
          } catch (error) {
            console.error("QA redaction save failed", error);
            this.redactionError =
              error?.message || "Redaction could not be saved.";
          } finally {
            this.isSavingRedaction = false;
          }
        },

        updateViewer(detail) {
          const pageUrls = Array.isArray(detail && detail.pageUrls)
            ? detail.pageUrls.filter(Boolean)
            : [];
          const directUrl = detail && detail.url ? detail.url : "";
          const predictedUrl =
            detail && detail.predictedUrl ? detail.predictedUrl : "";

          this.reset();
          this.isLoading = false;
          this.imageLoaded = false;

          if (detail && detail.redactionStatus) {
            this.redactionStatus = detail.redactionStatus;
            this.redactionPending = detail.redactionStatus !== "completed";
          }

          if (pageUrls.length && detail && detail.found) {
            this.pageUrls = pageUrls;
            this.currentPageIndex = 0;
            this.imageUrl = pageUrls[0];
            this.hasImage = true;
          } else if (directUrl && detail && detail.found) {
            this.pageUrls = [directUrl];
            this.currentPageIndex = 0;
            this.imageUrl = directUrl;
            this.hasImage = true;
          } else {
            this.pageUrls = [];
            this.currentPageIndex = 0;
            this.imageUrl = "";
            this.hasImage = false;
            this.documentWidth = 0;
            this.documentHeight = 0;
            if (predictedUrl || directUrl) {
              this.predictedUrl = predictedUrl || directUrl;
            }
          }

          if (this.redactionEnabled && this.hasImage) {
            this.renderActivePage();
          }
          this.emitRedactionState();
        },

        setLoading(state) {
          this.isLoading = !!state;
        },

        zoomIn() {
          const old = this.scale;
          this.scale = Math.min(this.scale + 0.3, 5);
          this.userHasZoomed = true;
          const diff = this.scale - old;
          this.panX *= 1 + diff / old;
          this.panY *= 1 + diff / old;
        },

        zoomOut() {
          const old = this.scale;
          this.scale = Math.max(this.scale - 0.3, 0.25);
          this.userHasZoomed = true;
          if (this.scale <= 1.1) {
            this.panX = 0;
            this.panY = 0;
          } else {
            const diff = old - this.scale;
            this.panX *= 1 - diff / old;
            this.panY *= 1 - diff / old;
          }
        },

        handleWheel(event) {
          if (!this.hasImage) return;
          if (event.deltaY < 0) {
            this.zoomIn();
          } else {
            this.zoomOut();
          }
        },

        fitToViewport(canvas) {
          const target = canvas || this.$refs.baseCanvas;
          const docWidth = this.documentWidth || (target ? target.width : 0);
          const docHeight = this.documentHeight || (target ? target.height : 0);
          if (!docWidth || !docHeight) return;
          const viewport =
            (target && target.closest && target.closest(".overflow-hidden")) ||
            this.$el?.querySelector?.(".overflow-hidden");
          if (!viewport) return;
          const padding = 32;
          const availableWidth = Math.max(viewport.clientWidth - padding, 1);
          const availableHeight = Math.max(viewport.clientHeight - padding, 1);
          const fitScale = Math.min(
            availableWidth / docWidth,
            availableHeight / docHeight,
            1
          );
          this.scale = Math.max(fitScale, 0.25);
          this.panX = 0;
          this.panY = 0;
        },

        reset() {
          this.scale = 1;
          this.panX = 0;
          this.panY = 0;
          this.userHasZoomed = false;
          if (this.redactionEnabled && this.hasImage) {
            this.fitToViewport();
          }
        },

        async selectPage(index) {
          if (index < 0 || index >= this.pageUrls.length) return;
          this.currentPageIndex = index;
          this.imageUrl = this.pageUrls[index];
          if (this.redactionEnabled) {
            await this.renderActivePage();
          } else if (!this.userHasZoomed) {
            this.scale = 1;
            this.panX = 0;
            this.panY = 0;
          }
        },

        previousPage() {
          this.selectPage(this.currentPageIndex - 1);
        },

        nextPage() {
          this.selectPage(this.currentPageIndex + 1);
        },

        startPan(event) {
          if (this.scale <= 1.05 || this.editMode) return;
          event.preventDefault();
          this.isPanning = true;
          this.startX = event.clientX - this.panX;
          this.startY = event.clientY - this.panY;
        },

        doPan(event) {
          if (!this.isPanning) return;
          this.panX = event.clientX - this.startX;
          this.panY = event.clientY - this.startY;
        },

        endPan() {
          this.isPanning = false;
        },
      };
    };
  }
</script>
